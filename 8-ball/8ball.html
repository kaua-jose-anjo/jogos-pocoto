<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8-Ball Poccotó - Pocoto Games</title>
    <link rel="stylesheet" href="../home.css">
    <link rel="stylesheet" href="8ball.css">
</head>
<body>
    <header class="main-header">
        <div class="header-branding">
            <img src="../imagens/fc8af01b-68f0-4de5-a37d-a91e8eed5f08.webp" alt="8-Ball Poccotó" class="logo-img">
            <div>
                <h1>Sinuca 8-Ball Poccotó</h1>
                <p>Mesa de Bilhar do Cavalo Bançudo</p>
            </div>
        </div>
        <div>
            <a href="../home.html" class="btn-primary">← Voltar à Home</a>
        </div>
    </header>

    <main class="game-container">
        <div class="game-card">
            <div class="game-hud">
                <span class="hud-item">Jogador: <strong id="player-name">Gamer</strong></span>
                <span class="hud-item">Bolas Restantes: <strong id="balls-left">7</strong></span>
                <span class="hud-item">Pontuação: <strong id="score">0</strong></span>
            </div>

            <div class="canvas-wrapper">
                <canvas id="poolTable" width="800" height="400"></canvas>
            </div>

            <div class="controls-panel">
                <p>💡 <strong>Como Jogar:</strong> Ajusta o ângulo com o rato/mouse, mantém o botão premido para carregar a força do taco e solta para tacar!</p>
                <button id="btn-restart" class="btn-primary">Reiniciar Partida</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Pocoto Games - Todos os direitos reservados.</p>
    </footer>

    <script src="8ball.js"></script>
</body>
</html>
