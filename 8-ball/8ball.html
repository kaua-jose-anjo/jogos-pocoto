<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8-Ball Pool - Pocotó Games</title>
    <link rel="stylesheet" href="../home.css">
    <link rel="stylesheet" href="8ball.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/poly-decomp@0.3.0/build/decomp.min.js"></script>
    <!-- Biblioteca PeerJS para Multiplayer Online sem servidor -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
    <header class="main-header">
        <div class="header-container">
            <a href="../index.html" class="logo">
                <span class="logo-icon">🐴</span> Pocotó Games
            </a>
            <nav class="main-nav">
                <a href="../index.html">🏠 Início</a>
                <a href="8ball.html" class="active">🎱 8-Ball</a>
                <a href="../acerte-pocoto/acerteopocoto.html">🔨 Acerte o Pocotó</a>
            </nav>
        </div>
    </header>

    <main class="game-container">
        <div class="game-card">
            <h2>🎱 Bilhar 8-Ball</h2>
            
            <div class="game-hud">
                <div class="hud-item" id="player-name">Vez do Jogador 1</div>
                <div class="hud-item" id="balls-left">🔴 8 | 🔵 8</div>
                <div class="hud-item" id="score">P1: 0 pts | P2: 0 pts</div>
            </div>

            <!-- Painel Multiplayer Online -->
            <div class="multiplayer-panel" style="background: #EFE8DE; padding: 0.8rem; border-radius: 12px; margin-bottom: 1rem; border: 2px solid #D2C4B4; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px;">
                <button id="btn-create-room" style="padding: 0.5rem 1rem; font-weight: 700; border: none; border-radius: 8px; background: #2E6F32; color: #FFF; cursor: pointer;">🌐 Criar Sala Online</button>
                <input type="text" id="room-code-input" placeholder="Código da sala (ex: pocoto-1234)" style="padding: 0.5rem; border-radius: 8px; border: 1px solid #8B5A2B; width: 210px;">
                <button id="btn-join-room" style="padding: 0.5rem 1rem; font-weight: 700; border: none; border-radius: 8px; background: #8B5A2B; color: #FFF; cursor: pointer;">Entrar na Sala</button>
                <span id="online-status" style="font-size: 0.9rem; font-weight: 700; color: #6E441F; width: 100%; margin-top: 4px;">Modo Offline Ativo</span>
            </div>

            <div class="canvas-wrapper">
                <canvas id="poolTable" width="800" height="400"></canvas>
                
                <div class="power-bar-container">
                    <span class="power-bar-label">Força</span>
                    <div class="power-bar-track">
                        <div id="power-bar-fill" class="power-bar-fill"></div>
                    </div>
                    <span id="power-percentage" class="power-percentage">0%</span>
                </div>
            </div>

            <div class="controls-panel">
                <p><strong>Como Jogar:</strong> Mova o rato para mirar. Mantenha a <strong>Barra de Espaço</strong> premida para carregar a força e solte para dar a tacada.</p>
                <button id="btn-restart">Reiniciar Partida</button>
            </div>
        </div>
    </main>

    <script src="8ball.js"></script>
</body>
</html>
