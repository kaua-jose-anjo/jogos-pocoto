<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar • Pocotó Games</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <header class="auth-header">
        <a href="../index.html">🐴 Pocotó Games</a>
        <a href="../index.html" class="btn-voltar">🏠 Voltar ao Portal</a>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card">
            <h1>Entrar por E-mail</h1>
            <p class="auth-sub">Acesse sua conta do Pocotó Games</p>

            <form id="form-login">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required placeholder="voce@email.com">
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" required placeholder="Sua senha">
                </div>

                <button type="submit" class="btn-submit">Entrar</button>
                <div id="feedback" class="msg-feedback"></div>
            </form>

            <div class="auth-footer">
                Ainda não tem conta? <a href="../cadastro/index.html">Criar conta</a>
            </div>
        </div>
    </main>

    <script src="login.js"></script>
</body>
</html>
